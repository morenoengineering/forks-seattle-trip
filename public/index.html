<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SeaForks Trip Manager">
<meta name="theme-color" content="#243326">
<style>
  :root{
    --moss:#243326;
    --moss-2:#33452f;
    --fern:#6f8f65;
    --fog:#eef1e8;
    --tan:#c8b48e;
    --tide:#3c5a66;
    --rust:#a8593a;
    --paper:#f6f3ea;
    --ink:#1c241d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--moss);
    color:var(--fog);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  header{
    padding:28px 20px 18px;
    border-bottom:1px solid rgba(238,241,232,0.15);
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--tan);
    margin:0 0 6px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:28px;
    line-height:1.15;
    margin:0 0 10px;
    color:var(--paper);
  }
  .sub{
    font-size:13.5px;
    color:#c7d0c2;
    line-height:1.5;
    max-width:46ch;
  }
  .sched-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:14px 0 6px;
  }
  .sched-field{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .sched-field label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--tan);
  }
  .sched-field input[type=time]{
    background:var(--moss-2);
    border:1px solid rgba(238,241,232,0.25);
    color:var(--paper);
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    padding:6px 8px;
    border-radius:3px;
  }
  .sched-note{
    font-size:11px;
    color:#93a08d;
    line-height:1.4;
    margin-bottom:16px;
  }
  .plan-row{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
  }
  .plan-row .plabel{color:#c7d0c2;}
  .planBtn{
    background:var(--moss-2);
    border:1px solid rgba(238,241,232,0.25);
    color:#a8b6a3;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    padding:6px 10px;
    border-radius:3px;
    cursor:pointer;
  }
  .planBtn.active{
    background:var(--rust);
    border-color:var(--rust);
    color:var(--paper);
  }
  .pack-progress{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--tan);
    margin-bottom:16px;
  }
  .pack-section{margin-bottom:6px;}
  .pack-section h3{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:#a8b6a3;
    margin:20px 0 8px;
    border-bottom:1px solid rgba(238,241,232,0.12);
    padding-bottom:6px;
  }
  .pack-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid rgba(238,241,232,0.08);
    cursor:pointer;
  }
  .pack-item input[type=checkbox]{
    margin-top:2px;
    width:17px;
    height:17px;
    accent-color:var(--rust);
    flex-shrink:0;
  }
  .pack-item span{
    font-size:14px;
    color:var(--paper);
    line-height:1.4;
  }
  .pack-item.checked span{
    color:#7d8a78;
    text-decoration:line-through;
  }
  button.resetPack{
    background:none;
    border:1px solid rgba(238,241,232,0.3);
    color:#a8b6a3;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    padding:7px 12px;

<div id="lockScreen" style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--moss);">

    <p style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--tan); margin:0 0 8px;">Private trip planner</p>
    <h1 style="font-family:'Fraunces',serif; font-weight:600; font-size:24px; color:var(--paper); margin:0 0 22px;">Sign in</h1>

      style="width:100%; background:var(--moss-2); border:1px solid rgba(238,241,232,0.3); color:var(--paper); font-family:'IBM Plex Mono',monospace; font-size:15px; padding:12px 14px; border-radius:5px; text-align:center; margin-bottom:10px;">

      style="width:100%; background:var(--moss-2); border:1px solid rgba(238,241,232,0.3); color:var(--paper); font-family:'IBM Plex Mono',monospace; font-size:15px; padding:12px 14px; border-radius:5px; text-align:center; margin-bottom:14px;">
    <button id="unlockBtn"
      style="width:100%; background:var(--rust); color:var(--paper); border:none; font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.06em; padding:12px; border-radius:5px; cursor:pointer;">
      Unlock
    </button>
    <p id="lockError" style="font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--rust); margin-top:14px; min-height:16px;"></p>
  </div>

const APPROVED_EMAILS = [
  'willvict.moreno@gmail.com',
  'wjmoreno@alumni.cmu.edu'
];

function b64ToBytes(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function deriveKey(password, saltBytes, iterations){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: saltBytes, iterations, hash:'SHA-256'},
    keyMaterial,
    {name:'AES-GCM', length:256},
    false,
    ['decrypt']
  );
}

function reviveScripts(container){
  const scripts = Array.from(container.querySelectorAll('script'));
  scripts.forEach(old => {
    const s = document.createElement('script');
    for(const attr of old.attributes) s.setAttribute(attr.name, attr.value);
    s.textContent = old.textContent;
    old.parentNode.replaceChild(s, old);
  });
}

async function tryUnlock(){
  const email = document.getElementById('emailInput').value.trim().toLowerCase();
  const pw = document.getElementById('pwInput').value;
  const errEl = document.getElementById('lockError');
  errEl.textContent = '';
  if(!email || !pw){ return; }
  if(!APPROVED_EMAILS.includes(email)){
    errEl.textContent = 'Email not recognized — contact the trip organizer for access.';
    return;
  }
  try{
    const saltBytes = b64ToBytes(ENC.salt);
    const ivBytes = b64ToBytes(ENC.iv);
    const dataBytes = b64ToBytes(ENC.data);
    const key = await deriveKey(pw, saltBytes, ENC.iterations);
    const plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv: ivBytes}, key, dataBytes);
    const html = new TextDecoder().decode(plainBuf);

    document.getElementById('lockScreen').remove();
    const root = document.getElementById('appRoot');
    root.innerHTML = html;
    root.style.display = '';
    reviveScripts(root);
  }catch(e){
    errEl.textContent = 'Wrong passcode — try again.';
  }
}

document.getElementById('unlockBtn').addEventListener('click', tryUnlock);
document.getElementById('emailInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') document.getElementById('pwInput').focus();
});
document.getElementById('pwInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') tryUnlock();
});
document.getElementById('emailInput').focus();
</script>
