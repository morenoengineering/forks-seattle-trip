<style>
  :root{
    --moss:#243326;
    --moss-2:#33452f;
    --fern:#6f8f65;
    --fog:#eef1e8;
    --tan:#c8b48e;
    --tide:#3c5a66;
    --rust:#a8593a;
    --paper:#f6f3ea;
    --ink:#1c241d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--moss);
    color:var(--fog);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;}

  /* ---------- lock screen ---------- */
  #lockScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(111,143,101,.28), transparent 62%),
      var(--moss);
  }
  .lockbox{
    width:100%;
    max-width:340px;
    text-align:center;
  }
  .lockmark{
    width:56px;height:56px;
    margin:0 auto 18px;
    display:block;
  }
  .lockbox .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--tan);
    margin:0 0 8px;
  }
  .lockbox h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:27px;
    line-height:1.15;
    margin:0 0 8px;
    color:var(--paper);
  }
  .lockbox .hint{
    font-size:13px;
    color:#9fae99;
    line-height:1.55;
    margin:0 0 22px;
  }
  .lockbox input{
    width:100%;
    background:var(--moss-2);
    border:1px solid rgba(238,241,232,.25);
    color:var(--paper);
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    padding:12px 13px;
    border-radius:5px;
    margin-bottom:10px;
  }
  .lockbox input::placeholder{color:#8a9a85;}
  .lockbox input:focus{outline:none;border-color:var(--tan);}
  #unlockBtn{
    width:100%;
    background:var(--rust);
    border:1px solid var(--rust);
    color:var(--paper);
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    padding:13px;
    border-radius:5px;
    cursor:pointer;
    margin-top:4px;
  }
  #unlockBtn:hover{filter:brightness(1.1);}
  #unlockBtn:disabled{opacity:.6;cursor:default;}
  #lockError{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:#e8a58c;
    margin-top:14px;
    min-height:16px;
    line-height:1.4;
  }
</style>
</head>
<body>
<div id="lockScreen">
  <div class="lockbox">
    <svg class="lockmark" viewBox="0 0 100 100" aria-hidden="true">
      <rect width="100" height="100" rx="20" fill="#33452f"/>
      <path d="M10 68 L32 34 L48 58 L62 40 L90 68 Z" fill="#6f8f65"/>
      <path d="M0 72 h100 v28 H0 Z" fill="#3c5a66"/>
    </svg>
    <p class="eyebrow">Føroyar &middot; Sep 6&ndash;11</p>
    <h1>Faroe Islands</h1>
    <p class="hint">Trip details for our family only. Enter your email and the trip passcode.</p>
    <input type="email" id="emailInput" autocomplete="off" spellcheck="false" placeholder="Email" inputmode="email">
    <input type="password" id="pwInput" autocomplete="off" spellcheck="false" placeholder="Passcode">
    <button id="unlockBtn">Unlock</button>
    <p id="lockError"></p>
  </div>
</div>

const APPROVED_EMAILS = [
  'willvict.moreno@gmail.com',
  'wjmoreno@alumni.cmu.edu'
];

function b64ToBytes(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function deriveKey(password, saltBytes, iterations){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: saltBytes, iterations, hash:'SHA-256'},
    keyMaterial,
    {name:'AES-GCM', length:256},
    false,
    ['decrypt']
  );
}

function reviveScripts(container){
  const scripts = Array.from(container.querySelectorAll('script'));
  scripts.forEach(old => {
    const s = document.createElement('script');
    for(const attr of old.attributes) s.setAttribute(attr.name, attr.value);
    s.textContent = old.textContent;
    old.parentNode.replaceChild(s, old);
  });
}

async function tryUnlock(){
  const email = document.getElementById('emailInput').value.trim().toLowerCase();
  const pw = document.getElementById('pwInput').value;
  const errEl = document.getElementById('lockError');
  const btn = document.getElementById('unlockBtn');
  errEl.textContent = '';
  if(!email || !pw){ return; }
  if(!APPROVED_EMAILS.includes(email)){
    errEl.textContent = 'Email not recognized — contact the trip organizer for access.';
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Unlocking…';
  try{
    const saltBytes = b64ToBytes(ENC.salt);
    const ivBytes = b64ToBytes(ENC.iv);
    const dataBytes = b64ToBytes(ENC.data);
    const key = await deriveKey(pw, saltBytes, ENC.iterations);
    const plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv: ivBytes}, key, dataBytes);
    const html = new TextDecoder().decode(plainBuf);

    document.getElementById('lockScreen').remove();
    const root = document.getElementById('appRoot');
    root.innerHTML = html;
    root.style.display = '';
    reviveScripts(root);
  }catch(e){
    errEl.textContent = 'Wrong passcode — try again.';
    btn.disabled = false;
    btn.textContent = 'Unlock';
  }
}

document.getElementById('unlockBtn').addEventListener('click', tryUnlock);
document.getElementById('emailInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') document.getElementById('pwInput').focus();
});
document.getElementById('pwInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') tryUnlock();
});
document.getElementById('emailInput').focus();
