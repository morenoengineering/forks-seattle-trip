<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trip Rhythm">
<meta name="theme-color" content="#243326">
<style>
  :root{
    --moss:#243326;
    --moss-2:#33452f;
    --fern:#6f8f65;
    --fog:#eef1e8;
    --tan:#c8b48e;
    --tide:#3c5a66;
    --rust:#a8593a;
    --paper:#f6f3ea;
    --ink:#1c241d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--moss);
    color:var(--fog);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  header{
    padding:28px 20px 18px;
    border-bottom:1px solid rgba(238,241,232,0.15);
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--tan);
    margin:0 0 6px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:28px;
    line-height:1.15;
    margin:0 0 10px;
    color:var(--paper);
  }
  .sub{
    font-size:13.5px;
    color:#c7d0c2;
    line-height:1.5;
    max-width:46ch;
  }
  .sched-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:14px 0 6px;
  }
  .sched-field{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .sched-field label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--tan);
  }
  .sched-field input[type=time]{
    background:var(--moss-2);
    border:1px solid rgba(238,241,232,0.25);
    color:var(--paper);
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    padding:6px 8px;
    border-radius:3px;
  }
  .sched-note{
    font-size:11px;
    color:#93a08d;
    line-height:1.4;
    margin-bottom:16px;
  }
  .plan-row{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
  }
  .plan-row .plabel{color:#c7d0c2;}
  .planBtn{
    background:var(--moss-2);
    border:1px solid rgba(238,241,232,0.25);
    color:#a8b6a3;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    padding:6px 10px;
    border-radius:3px;
    cursor:pointer;
  }
  .planBtn.active{
    background:var(--rust);
    border-color:var(--rust);
    color:var(--paper);
  }
  .pack-progress{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--tan);
    margin-bottom:16px;
  }
  .pack-section{margin-bottom:6px;}
  .pack-section h3{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:#a8b6a3;
    margin:20px 0 8px;
    border-bottom:1px solid rgba(238,241,232,0.12);
    padding-bottom:6px;
  }
  .pack-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid rgba(238,241,232,0.08);
    cursor:pointer;
  }
  .pack-item input[type=checkbox]{
    margin-top:2px;
    width:17px;
    height:17px;
    accent-color:var(--rust);
    flex-shrink:0;
  }
  .pack-item span{
    font-size:14px;
    color:var(--paper);
    line-height:1.4;
  }
  .pack-item.checked span{
    color:#7d8a78;
    text-decoration:line-through;
  }
  button.resetPack{
    background:none;
    border:1px solid rgba(238,241,232,0.3);
    color:#a8b6a3;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    padding:7px 12px;
    border-radius:4px;
    cursor:pointer;
    margin-top:18px;
  }
  /* Reservations */
  .res-item{

    padding:13px 0;
  }
  .res-top{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .res-title{font-size:14.5px; font-weight:600; color:var(--paper);}
  .statusBtn{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    padding:5px 10px;
    border-radius:3px;
    border:1px solid rgba(238,241,232,0.25);
    background:none;
    cursor:pointer;
    flex-shrink:0;
  }
  .statusBtn.booked{background:rgba(111,143,101,0.35); color:#d3e6ca; border-color:var(--fern);}
  .statusBtn.pending{background:rgba(168,89,58,0.2); color:#f0c6ae; border-color:var(--rust);}
  .res-note-hint{font-size:12px; color:#93a08d; margin:5px 0 6px;}
  .res-item input[type=text]{
    width:100%;
    background:var(--moss-2);
    border:1px solid rgba(238,241,232,0.2);
    color:var(--paper);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    padding:7px 9px;
    border-radius:4px;
  }

  /* Vault */
  .vault-item{
    background:var(--moss-2);
    border:1px solid rgba(238,241,232,0.15);
    border-radius:5px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .vault-item input, .vault-item textarea{
    width:100%;
    background:transparent;
    border:none;
    color:var(--paper);
    font-family:'Inter',sans-serif;
    padding:3px 0;
  }
  .vault-item input.vtitle{font-size:14.5px; font-weight:600; margin-bottom:4px;}
  .vault-item textarea.vnote{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:#c2ccbc;
    min-height:44px;
    resize:vertical;
  }
  .vault-item input:focus, .vault-item textarea:focus{outline:1px solid var(--rust);}
  .vault-remove{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:#c98a6f;
    background:none;
    border:none;
    cursor:pointer;
    padding:6px 0 0;
  }
  button.addBtn{
    background:none;
    border:1px dashed rgba(238,241,232,0.35);
    color:var(--tan);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    padding:10px;
    width:100%;
    border-radius:5px;
    cursor:pointer;
    margin-top:6px;
  }

  /* Emergency */
  .sos-block{
    background:var(--moss-2);
    border:1px solid rgba(238,241,232,0.15);
    border-radius:6px;
    padding:14px 16px;
    margin-bottom:16px;
  }
  .sos-block.primary{border-color:var(--rust); background:rgba(168,89,58,0.12);}
  .sos-block h3{
    font-family:'Fraunces',serif;
    font-size:16px;
    margin:0 0 4px;
    color:var(--paper);
  }
  .sos-block .role{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--tan);
    margin-bottom:8px;
  }
  .sos-block p{font-size:13px; color:#c2ccbc; line-height:1.5; margin:3px 0;}
  .sos-block a{color:#bcdbe4;}
  .sos-block .maplink{
    display:inline-block;
    margin-top:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-decoration:none;
    border:1px solid rgba(188,219,228,0.4);
    padding:4px 8px;
    border-radius:3px;
  }
  .sos-block .maplink:hover{background:rgba(188,219,228,0.12);}
  .sos-911{
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    color:var(--rust);
    font-size:13px;
    border:1px solid var(--rust);
    border-radius:5px;
    padding:10px;
    margin-bottom:18px;
  }

  nav.daytabs{
    display:flex;
    overflow-x:auto;
    background:var(--moss-2);
    border-bottom:1px solid rgba(238,241,232,0.15);
    position:sticky;
    top:0;
    z-index:5;
  }
  nav.daytabs button{
    flex:1;
    min-width:82px;
    background:none;
    border:none;
    color:#a8b6a3;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:14px 6px 12px;
    cursor:pointer;
    border-bottom:3px solid transparent;
  }
  nav.daytabs button .d{
    display:block;
    font-family:'Fraunces',serif;
    font-size:17px;
    color:var(--fog);
    text-transform:none;
    letter-spacing:0;
    margin-top:2px;
  }
  nav.daytabs button.active{
    color:var(--tan);
    border-bottom-color:var(--rust);
  }
  nav.daytabs button.active .d{color:var(--paper);}

  main{padding:18px 20px 0;}

  .daytitle{
    font-family:'Fraunces',serif;
    font-size:20px;
    color:var(--paper);
    margin:4px 0 2px;
  }
  .daysub{font-size:13px; color:#b7c2b1; margin-bottom:14px;}

  .callout{
    background:rgba(168,89,58,0.16);
    border:1px solid rgba(168,89,58,0.5);
    border-radius:4px;
    padding:12px 14px;
    font-size:13px;
    line-height:1.5;
    color:#f0d9c9;
    margin-bottom:16px;
  }
  .callout b{color:var(--tan);}

  .rhythm{
    display:flex;
    height:34px;
    border-radius:3px;
    overflow:hidden;
    margin-bottom:6px;
    border:1px solid rgba(238,241,232,0.2);
  }
  .rhythm .seg{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    letter-spacing:0.02em;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
  }
  .seg.awake{background:var(--fern);}
  .seg.nap{background:var(--tan);}
  .seg.nap.striped{
    background-image:repeating-linear-gradient(45deg, var(--tan), var(--tan) 6px, #b9a374 6px, #b9a374 12px);
  }
  .rhythm-legend{
    display:flex;
    gap:16px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:#a8b6a3;
    margin-bottom:20px;

  .rhythm-legend span{display:flex; align-items:center; gap:5px;}
  .swatch{width:9px;height:9px;border-radius:2px;display:inline-block;}

  ul.itin{list-style:none; margin:0 0 8px; padding:0;}
  ul.itin li{
    display:flex;
    gap:14px;
    padding:13px 0;
    border-bottom:1px solid rgba(238,241,232,0.12);
  }

    font-weight:600;
    color:var(--paper);

    font-size:13px;
    color:#c2ccbc;
    line-height:1.45;

    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    padding:1px 6px;
    border-radius:2px;
    margin-left:6px;
    position:relative;
    top:-1px;
  }

  .tag.feed{background:rgba(111,143,101,0.35); color:#d3e6ca;}

  .pathblock{
    background:var(--moss-2);
    border:1px solid rgba(238,241,232,0.15);
    border-radius:5px;
    padding:14px 16px;
    margin-bottom:14px;
  }
  .pathblock h3{
    font-family:'Fraunces',serif;
    font-size:15.5px;
    margin:0 0 8px;
    color:var(--paper);
  }
  .pathblock p{font-size:13px; color:#c2ccbc; line-height:1.5; margin:0;}
  .pathblock.recommended{border-color:var(--rust);}
  .pathblock.recommended h3::after{
    content:" — recommended";
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    color:var(--rust);
    letter-spacing:0.05em;
  }

    margin-top:26px;
    border-top:1px solid rgba(238,241,232,0.15);
    padding-top:4px;
  }
  .kit-toggle{
    width:100%;
    background:none;
    border:none;
    color:var(--paper);
    font-family:'Fraunces',serif;
    font-size:17px;
    padding:16px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
  }
  .kit-toggle .arrow{
    font-family:'IBM Plex Mono',monospace;
    color:var(--tan);
    font-size:13px;
    transition:transform 0.2s ease;
  }
  .kit-toggle.open .arrow{transform:rotate(180deg);}
  .kit-body{display:none; padding-bottom:26px;}
  .kit-body.open{display:block;}

  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--tan);
    margin-bottom:5px;
  }
  .field input, .field textarea{
    width:100%;
    background:var(--moss-2);
    border:1px solid rgba(238,241,232,0.25);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    padding:9px 10px;
    border-radius:4px;
  }
  .field textarea{min-height:60px; resize:vertical; font-family:'IBM Plex Mono',monospace; font-size:12px;}
  .field input:focus, .field textarea:focus{outline:2px solid var(--rust); outline-offset:1px;}

  .field-row{display:flex; gap:8px; align-items:center;}
  .field-row input{flex:1;}
  .mapBtn{
    flex-shrink:0;
    background:var(--moss-2);
    border:1px solid rgba(238,241,232,0.25);
    color:var(--tan);
    font-size:16px;
    padding:9px 11px;
    border-radius:4px;
    cursor:pointer;
    line-height:1;
  }
  .mapBtn:hover{border-color:var(--rust);}

  /* Dashboard quick view */
  .dashToggleBtn{
    position:absolute;
    top:0;
    right:0;
    background:var(--rust);
    color:var(--paper);
    border:none;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;

  .dashToggleBtn .badge{

    border-radius:10px;
    padding:1px 6px;

  .dash-time.wide{min-width:96px;}

  /* Dashboard */
  .dash-daylabel{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--tan);
    margin:20px 0 8px;
    border-bottom:1px solid rgba(238,241,232,0.12);
    padding-bottom:6px;
  }
  .dash-daylabel:first-child{margin-top:4px;}
  .dash-item{
    display:flex;
    gap:12px;
    align-items:flex-start;
    padding:11px 0;
    border-bottom:1px solid rgba(238,241,232,0.1);
    cursor:pointer;
  }
  .dash-item input[type=checkbox]{
    margin-top:3px;
    width:17px;
    height:17px;
    accent-color:var(--rust);
    flex-shrink:0;
  }
  .dash-time{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--tan);
    min-width:60px;
    padding-top:1px;
    flex-shrink:0;
  }
  .dash-title{font-size:14px; font-weight:600; color:var(--paper); margin-bottom:2px;}
  .dash-detail{font-size:12.5px; color:#c2ccbc; line-height:1.4;}
  .dash-item.checked .dash-title, .dash-item.checked .dash-time{color:#7d8a78; text-decoration:line-through;}
  .dash-item.checked .dash-detail{color:#7d8a78;}

  .kit-grid{display:grid; grid-template-columns:1fr; gap:0;}
  .kit-sectionlabel{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:#a8b6a3;

  }
  .trail-row{display:flex; gap:8px; align-items:flex-end; margin-bottom:10px;}
  .trail-row .field{flex:1; margin-bottom:0;}
  .trail-row .fixed-name{
    font-size:12.5px;
    color:#c2ccbc;
    padding:9px 0 0;
    min-width:118px;
  }

  .kit-actions{display:flex; gap:10px; margin-top:18px; align-items:center;}
  button.save{
    background:var(--rust);
    color:var(--paper);
    border:none;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    padding:10px 18px;
    border-radius:4px;
    cursor:pointer;
  }
  .kit-status{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:#a8b6a3;
  }
  footer{
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:#6f8069;
    padding:20px;
  }
</style>

const APPROVED_EMAILS = [
  'willvict.moreno@gmail.com',
  'wjmoreno@alumni.cmu.edu'
];

function b64ToBytes(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function deriveKey(password, saltBytes, iterations){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: saltBytes, iterations, hash:'SHA-256'},
    keyMaterial,
    {name:'AES-GCM', length:256},
    false,
    ['decrypt']
  );
}

function reviveScripts(container){
  const scripts = Array.from(container.querySelectorAll('script'));
  scripts.forEach(old => {
    const s = document.createElement('script');
    for(const attr of old.attributes) s.setAttribute(attr.name, attr.value);
    s.textContent = old.textContent;
    old.parentNode.replaceChild(s, old);
  });
}

async function tryUnlock(){
  const email = document.getElementById('emailInput').value.trim().toLowerCase();
  const pw = document.getElementById('pwInput').value;
  const errEl = document.getElementById('lockError');
  errEl.textContent = '';
  if(!email || !pw){ return; }
  if(!APPROVED_EMAILS.includes(email)){
    errEl.textContent = 'Email not recognized — contact the trip organizer for access.';
    return;
  }
  try{
    const saltBytes = b64ToBytes(ENC.salt);
    const ivBytes = b64ToBytes(ENC.iv);
    const dataBytes = b64ToBytes(ENC.data);
    const key = await deriveKey(pw, saltBytes, ENC.iterations);
    const plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv: ivBytes}, key, dataBytes);
    const html = new TextDecoder().decode(plainBuf);

    document.getElementById('lockScreen').remove();
    const root = document.getElementById('appRoot');
    root.innerHTML = html;
    root.style.display = '';
    reviveScripts(root);
  }catch(e){
    errEl.textContent = 'Wrong passcode — try again.';
  }
}

document.getElementById('unlockBtn').addEventListener('click', tryUnlock);
document.getElementById('emailInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') document.getElementById('pwInput').focus();
});
document.getElementById('pwInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') tryUnlock();
});
document.getElementById('emailInput').focus();
</script>
